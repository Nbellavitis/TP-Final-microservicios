stages:
  - test
  - build
  - deliver
  - deploy-staging
  - integration-staging
  - deliver-production
  - deploy-production

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

include:
  - local: ".gitlab/ci/templates/service-placeholder.yml"
  - local: ".gitlab/ci/services/*.yml"
