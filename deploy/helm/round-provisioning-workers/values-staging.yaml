serviceName: round-provisioning-workers
context: "Tournament Orchestration"
replicaCount: 1
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  type: ClusterIP
  port: 80
env:
  UNOARENA_ENVIRONMENT: "staging"
  PLACEHOLDER_KIND: "worker"
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"