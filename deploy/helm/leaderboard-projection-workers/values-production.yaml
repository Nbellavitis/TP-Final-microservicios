serviceName: leaderboard-projection-workers
context: "Ranking"
replicaCount: 1
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  type: ClusterIP
  port: 80
env:
  UNOARENA_ENVIRONMENT: "production"
  PLACEHOLDER_KIND: "worker"
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"